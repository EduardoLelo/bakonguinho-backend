services:
  - type: web
    name: bakonguinho-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: DB_PATH
        value: /var/data/bakonguinho.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: bakonguinho-data
      mountPath: /var/data
      sizeGB: 1
